<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MirrorUI fixture</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #1a1a1a; background: #f3f3f3; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 24px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: #2828e8; font-weight: 700; }
  h2 { font-size: 30px; line-height: 1.25; margin: 8px 0 32px; letter-spacing: -0.025em; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .card { background: #fff; border: 1px solid #d4d4d4; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .card h3 { margin: 0; font-size: 20px; }
  .card p { margin: 0; color: #7a7a7a; line-height: 1.625; }
  .card a { margin-top: auto; align-self: flex-start; background: #000; color: #fff; text-decoration: none;
            padding: 10px 20px; border-radius: 9999px; font-size: 14px; }
  .card a { transition: background-color .2s ease; }
  .card a:hover { background: #2828e8; }
  .card:hover h3 { color: #2828e8; }
  .eyebrow::before { content: "★ "; }
  h2::after { content: ""; display: block; width: 48px; height: 3px; background: #2828e8; margin-top: 12px; }
  form { display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
  input { border: 0; border-bottom: 1px solid #a6a6a7; background: transparent; font-size: 18px; padding: 12px 0; }
  input::placeholder { color: #a6a6a7; }
  @media (min-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    h2 { font-size: 36px; }
    form { flex-direction: row; }
    form input { flex: 1; }
  }
  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    h2 { font-size: 48px; }
  }
</style>
</head>
<body>
<section class="wrap">
  <div class="eyebrow">Services</div>
  <h2>What we build</h2>
  <div class="grid">
    <article class="card"><h3>Websites</h3><p>Fast, accessible sites that are easy to edit.</p><a href="#">Learn more</a></article>
    <article class="card"><h3>Brand systems</h3><p>Type, color and layout rules your team can actually use.</p><a href="#">Learn more</a></article>
    <article class="card"><h3>Product UI</h3><p>Interfaces for dashboards and internal tools.</p><a href="#">Learn more</a></article>
  </div>
  <form>
    <input placeholder="Name">
    <input placeholder="Email">
  </form>
</section>
</body>
</html>
