<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css">
<!-- A full-height hero with centred text: in a preview iframe sized to its content, 100vh fed back into the
     frame height and grew forever (a landing page's hero came out blank). -->
<style>
  body { padding: 0; background: #0b0b10; color: #e5e7eb; }
  #t { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 64px; margin: 0; }
  em { color: #f43f5e; }
</style>
<section id="t"><h1>Büyük <em>vurgulu</em><br>başlık</h1><p>Alt yazı</p></section>
