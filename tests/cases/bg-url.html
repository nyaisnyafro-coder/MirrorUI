<!-- background-image url() with an underscore in the file name: computed as url("…bg_pattern.svg"). The quotes
     must not end class="…" and the underscore must not turn into a space (the missing hero photo). -->
<style>
  #t { width: 320px; height: 140px; border-radius: 12px; color: #fff; padding: 16px; box-sizing: border-box;
    background-image: linear-gradient(90deg, rgba(0, 0, 0, .6), transparent), url("assets/bg_pattern.svg"); background-size: 40px 40px; }
</style>
<div id="t"><b>Featured</b></div>
