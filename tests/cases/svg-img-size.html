<!-- Icons sized only by CSS. Images and SVGs keep their aspect ratio, so width:auto alone changes nothing:
     the size test has to drop both at once (a real page's logo and icons came out giant). -->
<style>
  #t { display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; width: 280px; }
  .icon { width: 16px; height: 16px; color: #e11d48; }
  .logo { width: 28px; height: 28px; border-radius: 4px; }
</style>
<div id="t"><img class="logo" src="assets/logo_big.svg" alt="Logo"><b>Marka</b>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
