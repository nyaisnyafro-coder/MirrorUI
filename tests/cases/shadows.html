<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="_base.css">
<!-- Chrome reports box-shadow colour first ("rgba(…) 0px 30px 60px -20px"); Tailwind v4 drops an arbitrary shadow
     written that way, so every cloned shadow vanished. -->
<style>
  #t { display: flex; gap: 40px; padding: 40px; background: #f8fafc; }
  .a { width: 120px; height: 80px; border-radius: 16px; background: #4c1d95; box-shadow: 0 30px 60px -20px rgba(76, 29, 149, .6); }
  .b { width: 120px; height: 80px; border-radius: 8px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 8px 16px -4px rgba(0, 0, 0, .25); }
  .c { width: 120px; height: 80px; border-radius: 8px; background: #fff; box-shadow: inset 0 2px 6px #94a3b8, 0 0 0 3px #c7d2fe; }
</style>
<div id="t"><div class="a"></div><div class="b"></div><div class="c"></div></div>
