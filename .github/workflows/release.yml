# A version tag (git tag v0.4.1 && git push origin v0.4.1) builds the extension ZIP with
# scripts/package_extension.py (which checks the manifest's files and that no code is loaded remotely) and
# publishes it as a GitHub Release, the file people download and load unpacked (see the README).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches the manifest version
        run: |
          version=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but manifest says $version"; exit 1; }
      - name: Package
        run: python scripts/package_extension.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mirrorui-*.zip
          generate_release_notes: true
